{% extends "base.html" %}

{% block title %}模型仓库 - VeriVek{% endblock %}

{% block nav_models_class %}tab-active{% endblock %}

{% block content %}
<div class="fade-in space-y-6">
    <!-- 页面头部 -->
    <div class="flex justify-between items-center mb-8">
        <div>
            <h1 class="text-3xl font-bold mb-2">模型仓库</h1>
            <p class="text-gray-400">预训练模型与自定义架构管理</p>
        </div>
        <div class="flex space-x-3">
            <!-- 导入模型按钮 -->
            <button onclick="openImportModal()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 rounded-xl font-medium transition-all border border-emerald-500/30 flex items-center space-x-2 neon-glow">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path>
                </svg>
                <span>导入模型</span>
            </button>
            <button class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-medium transition-all">
                新建架构
            </button>
        </div>
    </div>

    <!-- 模型列表 -->
    <div class="glass-panel rounded-2xl overflow-hidden">
        <div class="p-6 border-b border-white/5">
            <div class="flex space-x-6 text-sm">
                <button class="text-white font-medium border-b-2 border-indigo-500 pb-2">全部模型</button>
                <button class="text-gray-400 hover:text-white transition-colors pb-2">计算机视觉</button>
                <button class="text-gray-400 hover:text-white transition-colors pb-2">自然语言处理</button>
                <button class="text-gray-400 hover:text-white transition-colors pb-2">自定义</button>
            </div>
        </div>

        <div class="divide-y divide-white/5" id="model-list-container">
            <!-- 加载状态 -->
            <div class="p-8 text-center text-gray-500" id="model-list-loading">
                <svg class="animate-spin w-8 h-8 mx-auto mb-2 text-indigo-500" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <p>加载模型列表...</p>
            </div>
        </div>
    </div>
</div>

<!-- 模型导入模态框 -->
<div id="import-modal" class="fixed inset-0 z-[100] hidden">
    <!-- 背景遮罩 -->
    <div class="absolute inset-0 bg-black/70 backdrop-blur-sm transition-opacity" onclick="closeImportModal()"></div>

    <!-- 模态框内容 -->
    <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-full max-w-2xl p-4">
        <div class="glass-panel rounded-2xl p-8 border border-white/10 shadow-2xl relative bg-[#13131f]/95">
            <!-- 关闭按钮 -->
            <button onclick="closeImportModal()" class="absolute top-4 right-4 p-2 hover:bg-white/10 rounded-lg transition-colors text-gray-400 hover:text-white">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>

            <h2 class="text-2xl font-bold mb-6 pr-8">导入模型</h2>

            <form id="import-model-form" onsubmit="handleModelImport(event)">
                <div class="space-y-6">
                    <!-- 文件上传区域 -->
                    <div id="drop-zone" class="border-2 border-dashed border-white/20 rounded-xl p-8 text-center hover:border-indigo-500/50 hover:bg-white/5 transition-all cursor-pointer relative group">
                        <input type="file" id="model-file" name="model_file" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" accept=".py" required>

                        <!-- 未选择文件状态 -->
                        <div id="upload-prompt" class="pointer-events-none transition-opacity duration-300">
                            <div class="w-16 h-16 rounded-full bg-indigo-500/10 flex items-center justify-center mx-auto mb-4 group-hover:scale-110 transition-transform">
                                <svg class="w-8 h-8 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                                </svg>
                            </div>
                            <p class="text-lg font-medium text-gray-300 mb-2">拖拽文件到此处或点击上传</p>
                            <p class="text-sm text-gray-500">支持 .py 格式</p>
                        </div>

                        <!-- 已选择文件状态 -->
                        <div id="file-selected" class="hidden pointer-events-none">
                            <div class="w-16 h-16 rounded-full bg-emerald-500/10 flex items-center justify-center mx-auto mb-4">
                                <svg class="w-8 h-8 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                </svg>
                            </div>
                            <p id="selected-filename" class="text-lg font-medium text-emerald-400 mb-2 break-all"></p>
                            <p class="text-sm text-gray-400">点击或拖拽更换文件</p>
                        </div>
                    </div>

                    <!-- 模型信息表单 -->
                    <div class="grid grid-cols-2 gap-4">
                        <div class="space-y-2">
                            <label class="block text-sm text-gray-400">模型名称 <span class="text-red-400">*</span></label>
                            <input type="text" id="import-model-name" name="model_name" required
                                class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 focus:outline-none focus:border-indigo-500 transition-colors text-white placeholder-gray-600"
                                placeholder="例如：ResNet-50-v2">
                        </div>
                        <div class="space-y-2">
                            <label class="block text-sm text-gray-400">分支名称</label>
                            <input type="text" id="import-branch-name" name="branch_name" value="main"
                                class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 focus:outline-none focus:border-indigo-500 transition-colors text-white"
                                placeholder="main">
                        </div>
                    </div>

                    <div class="space-y-2">
                        <label class="block text-sm text-gray-400">描述</label>
                        <textarea id="import-description" name="description" rows="3"
                            class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 focus:outline-none focus:border-indigo-500 transition-colors text-white resize-none placeholder-gray-600"
                            placeholder="模型描述信息、使用场景说明..."></textarea>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div class="space-y-2">
                            <label class="block text-sm text-gray-400">标签（用逗号分隔）</label>
                            <input type="text" id="import-tags" name="tags"
                                class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 focus:outline-none focus:border-indigo-500 transition-colors text-white placeholder-gray-600"
                                placeholder="CV, classification, pretrained...">
                        </div>
                        <div class="space-y-2">
                            <label class="block text-sm text-gray-400">版本备注</label>
                            <input type="text" id="import-message" name="message" value="Initial import"
                                class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 focus:outline-none focus:border-indigo-500 transition-colors text-white"
                                placeholder="Initial commit">
                        </div>
                    </div>

                    <!-- 上传进度条（默认隐藏） -->
                    <div id="upload-progress-container" class="hidden space-y-2">
                        <div class="flex justify-between text-sm">
                            <span class="text-gray-400">上传进度</span>
                            <span id="upload-percentage" class="text-indigo-400 font-mono">0%</span>
                        </div>
                        <div class="w-full bg-gray-800 rounded-full h-2 overflow-hidden">
                            <div id="upload-progress-bar" class="bg-gradient-to-r from-indigo-500 to-purple-500 h-full rounded-full transition-all duration-300 ease-out" style="width: 0%"></div>
                        </div>
                    </div>

                    <!-- 操作按钮 -->
                    <div class="flex justify-end space-x-3 pt-4 border-t border-white/5">
                        <button type="button" onclick="closeImportModal()"
                            class="px-6 py-3 bg-white/5 hover:bg-white/10 rounded-xl font-medium transition-colors border border-white/10 text-gray-300">
                            取消
                        </button>
                        <button type="submit" id="import-submit-btn"
                            class="px-6 py-3 bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed rounded-xl font-medium transition-all flex items-center space-x-2 shadow-lg shadow-indigo-500/25">
                            <span>开始导入</span>
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                            </svg>
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block page_scripts %}
<script src="{{ url_for('static', filename='js/_models.js') if url_for else 'static/js/_models.js' }}"></script>
{% endblock %}
