<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - VeriVek</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'verivek-dark': '#0a0a0f',
                        'verivek-card': '#13131f',
                        'verivek-accent': '#6366f1',
                        'verivek-success': '#10b981',
                        'verivek-warning': '#f59e0b',
                        'verivek-danger': '#ef4444',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-in-out',
                        'slide-up': 'slideUp 0.5s ease-out',
                        'glow': 'glow 2s ease-in-out infinite alternate',
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        glow: {
                            '0%': { boxShadow: '0 0 5px rgba(99, 102, 241, 0.3)' },
                            '100%': { boxShadow: '0 0 20px rgba(99, 102, 241, 0.6), 0 0 40px rgba(139, 92, 246, 0.3)' },
                        }
                    }
                }
            }
        };
    </script>
    <style>
        body {
            background: linear-gradient(160deg, #1a1a2e 0%, #131320 30%, #0d0d16 60%, #12121c 100%);
            background-attachment: fixed;
            min-height: 100vh;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                linear-gradient(160deg, rgba(99, 102, 241, 0.18) 0%, transparent 35%),
                linear-gradient(340deg, rgba(139, 92, 246, 0.15) 0%, transparent 35%);
            z-index: -1;
            pointer-events: none;
        }
        .login-card {
            background: rgba(19, 19, 31, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5),
                        0 0 0 1px rgba(99, 102, 241, 0.1);
        }
        .input-field {
            background: rgba(10, 10, 15, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        .input-field:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
            outline: none;
        }
        .input-field::placeholder {
            color: rgba(148, 163, 184, 0.5);
        }
        .input-field.error {
            border-color: #ef4444;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1);
        }
        .gradient-btn {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .gradient-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4);
        }
        .gradient-btn:active {
            transform: translateY(0);
        }
        .gradient-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s ease;
        }
        .gradient-btn:hover::before {
            left: 100%;
        }
        .security-badge {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        .user-badge {
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.3);
        }
        .checkbox-custom {
            appearance: none;
            width: 16px;
            height: 16px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            background: rgba(10, 10, 15, 0.6);
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
        }
        .checkbox-custom:checked {
            background: #6366f1;
            border-color: #6366f1;
        }
        .checkbox-custom:checked::after {
            content: '✓';
            position: absolute;
            color: white;
            font-size: 11px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(148, 163, 184, 0.5);
            cursor: pointer;
            transition: color 0.2s;
        }
        .password-toggle:hover {
            color: #6366f1;
        }
        .shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
        .loading-spinner {
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .role-tag {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s;
        }
        .role-tag:hover {
            background: rgba(99, 102, 241, 0.1);
            border-color: rgba(99, 102, 241, 0.3);
        }
        .role-tag.active {
            background: rgba(99, 102, 241, 0.2);
            border-color: #6366f1;
            color: #6366f1;
        }
        .error-message {
            color: #ef4444;
            font-size: 0.75rem;
            margin-top: 0.25rem;
            opacity: 0;
            transform: translateY(-10px);
            transition: all 0.3s ease;
        }
        .error-message.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body class="font-sans antialiased flex items-center justify-center p-4">

    <!-- 主登录容器 -->
    <div class="w-full max-w-md animate-slide-up">
        <!-- 系统标识区域 -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl mb-4 shadow-lg animate-glow">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-white mb-1">用户登录</h1>
            <p class="text-gray-400 text-sm">VeriVek-ML 机器学习平台</p>
        </div>

        <!-- 登录卡片 -->
        <div class="login-card rounded-2xl p-8" id="loginCard">
            <!-- 系统状态与用户统计 -->
            <div class="flex items-center justify-between mb-6 space-x-2">
                <div class="security-badge rounded-lg px-3 py-2 flex items-center space-x-2 flex-1">
                    <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
                    </svg>
                    <span class="text-xs text-emerald-400 font-medium">系统就绪</span>
                </div>
                <div class="user-badge rounded-lg px-3 py-2 flex items-center space-x-2 flex-1">
                    <svg class="w-4 h-4 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path>
                    </svg>
                    <span class="text-xs text-indigo-300"><span id="userCount">-</span> 个用户</span>
                </div>
            </div>

            <!-- 快速用户选择 -->
            <div class="mb-6">
                <label class="text-xs font-medium text-gray-500 uppercase tracking-wider mb-2 block">快速选择</label>
                <div class="flex space-x-2">
                    <button type="button" class="role-tag active rounded-lg px-3 py-2 text-xs text-gray-300 flex items-center space-x-2" onclick="selectUser('admin')">
                        <span class="w-2 h-2 rounded-full bg-red-400"></span>
                        <span>管理员</span>
                    </button>
                    <button type="button" class="role-tag rounded-lg px-3 py-2 text-xs text-gray-300 flex items-center space-x-2" onclick="selectUser('researcher')">
                        <span class="w-2 h-2 rounded-full bg-indigo-400"></span>
                        <span>研究员</span>
                    </button>
                    <button type="button" class="role-tag rounded-lg px-3 py-2 text-xs text-gray-300 flex items-center space-x-2" onclick="selectUser('guest')">
                        <span class="w-2 h-2 rounded-full bg-gray-400"></span>
                        <span>访客</span>
                    </button>
                </div>
            </div>

            <!-- 登录表单 -->
            <form id="loginForm" class="space-y-5">
                <!-- 用户名输入 -->
                <div class="space-y-2">
                    <label class="text-xs font-medium text-gray-400 uppercase tracking-wider">用户名</label>
                    <div class="relative">
                        <svg class="w-5 h-5 text-gray-500 absolute left-3 top-1/2 transform -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                        </svg>
                        <input
                            type="text"
                            id="username"
                            class="input-field w-full pl-10 pr-4 py-3 rounded-xl text-sm text-white placeholder-gray-500"
                            placeholder="输入用户名"
                            autocomplete="username"
                        >
                    </div>
                    <div id="usernameError" class="error-message">请输入用户名</div>
                </div>

                <!-- 密码输入 -->
                <div class="space-y-2">
                    <label class="text-xs font-medium text-gray-400 uppercase tracking-wider">密码</label>
                    <div class="relative">
                        <svg class="w-5 h-5 text-gray-500 absolute left-3 top-1/2 transform -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                        </svg>
                        <input
                            type="password"
                            id="password"
                            class="input-field w-full pl-10 pr-12 py-3 rounded-xl text-sm text-white placeholder-gray-500"
                            placeholder="输入密码"
                            autocomplete="current-password"
                        >
                        <button type="button" id="togglePassword" class="password-toggle">
                            <svg id="eyeIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                            </svg>
                            <svg id="eyeOffIcon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path>
                            </svg>
                        </button>
                    </div>
                    <div id="passwordError" class="error-message">请输入密码</div>
                </div>

                <!-- 记住我 -->
                <div class="flex items-center justify-between">
                    <label class="flex items-center space-x-2 cursor-pointer group">
                        <input type="checkbox" class="checkbox-custom" id="rememberMe">
                        <span class="text-sm text-gray-400 group-hover:text-gray-300 transition-colors">保持登录</span>
                    </label>
                </div>

                <!-- 全局错误提示 -->
                <div id="globalError" class="error-message text-center text-sm"></div>

                <!-- 登录按钮 -->
                <button
                    type="submit"
                    id="loginBtn"
                    class="gradient-btn w-full py-3.5 rounded-xl font-semibold text-white text-sm flex items-center justify-center space-x-2"
                >
                    <span id="btnText">进入系统</span>
                    <div id="btnLoader" class="loading-spinner hidden"></div>
                </button>
            </form>
        </div>

        <!-- 账户管理 -->
        <div class="text-center mt-6">
            <p class="text-sm text-gray-500">
                需要新账户？
                <a href="#" class="text-indigo-400 hover:text-indigo-300 font-medium transition-colors">联系管理员</a>
            </p>
        </div>

        <!-- 页脚信息 -->
        <div class="text-center mt-8">
            <div class="flex items-center justify-center space-x-4 text-xs text-gray-600">
                <span>VeriVek</span>
                <span>•</span>
                <span class="flex items-center space-x-1">
                    <span class="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-pulse-slow"></span>
                    <span>运行中</span>
                </span>
            </div>
        </div>
    </div>

    <script>
        // 页面加载时获取用户数量
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const response = await fetch('/api/users/count');
                const data = await response.json();
                if (data.success) {
                    document.getElementById('userCount').textContent = data.count;
                }
            } catch (error) {
                console.error('获取用户数量失败:', error);
                document.getElementById('userCount').textContent = '?';
            }

            // 检查是否已登录
            checkAuthStatus();
        });

        // 检查认证状态
        async function checkAuthStatus() {
            try {
                const response = await fetch('/api/auth/check');
                const data = await response.json();
                if (data.success && data.authenticated) {
                    // 已登录，直接跳转
                    window.location.href = '/dashboard';
                }
            } catch (error) {
                console.error('检查登录状态失败:', error);
            }
        }

        // 快速选择用户
        function selectUser(role) {
            currentRole = role;
            const config = userRoles[role];

            document.getElementById('username').value = config.username;
            document.getElementById('password').value = '';
            document.getElementById('password').focus();

            // 清除错误状态
            clearErrors();

            document.querySelectorAll('.role-tag').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.closest('.role-tag').classList.add('active');
        }

        let currentRole = 'admin';
        const userRoles = {
            admin: { username: 'admin' },
            researcher: { username: 'researcher' },
            guest: { username: 'guest' }
        };

        // 密码可见性切换
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eyeIcon');
        const eyeOffIcon = document.getElementById('eyeOffIcon');

        togglePassword.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            eyeIcon.classList.toggle('hidden');
            eyeOffIcon.classList.toggle('hidden');
        });

        // 表单提交
        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const btnText = document.getElementById('btnText');
        const btnLoader = document.getElementById('btnLoader');
        const loginCard = document.getElementById('loginCard');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            // 清除之前的错误
            clearErrors();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;

            // 前端验证
            let hasError = false;
            if (!username) {
                showFieldError('username', '请输入用户名');
                hasError = true;
            }
            if (!password) {
                showFieldError('password', '请输入密码');
                hasError = true;
            }

            if (hasError) {
                loginCard.classList.add('shake');
                setTimeout(() => loginCard.classList.remove('shake'), 500);
                return;
            }

            // 设置加载状态
            setLoading(true);

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password,
                        remember_me: rememberMe
                    })
                });

                const data = await response.json();

                if (data.success) {
                    // 登录成功
                    btnText.textContent = '验证通过!';
                    loginBtn.style.background = 'linear-gradient(135deg, #10b981 0%, #059669 100%)';

                    // 保存用户信息到 localStorage（用于前端显示）
                    localStorage.setItem('currentUser', JSON.stringify({
                        username: data.user.username,
                        role: data.user.role,
                        loginTime: new Date().toISOString()
                    }));

                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 800);
                } else {
                    // 登录失败
                    showGlobalError(data.error || '登录失败');
                    setLoading(false);

                    loginCard.classList.add('shake');
                    setTimeout(() => loginCard.classList.remove('shake'), 500);
                }

            } catch (error) {
                console.error('登录请求失败:', error);
                showGlobalError('网络错误，请稍后重试');
                setLoading(false);

                loginCard.classList.add('shake');
                setTimeout(() => loginCard.classList.remove('shake'), 500);
            }
        });

        // 设置加载状态
        function setLoading(loading) {
            if (loading) {
                btnText.textContent = '验证中...';
                btnLoader.classList.remove('hidden');
                loginBtn.disabled = true;
                loginBtn.classList.add('opacity-80', 'cursor-not-allowed');
            } else {
                btnText.textContent = '进入系统';
                btnLoader.classList.add('hidden');
                loginBtn.disabled = false;
                loginBtn.classList.remove('opacity-80', 'cursor-not-allowed');
                loginBtn.style.background = '';  // 重置样式
            }
        }

        // 显示字段错误
        function showFieldError(fieldId, message) {
            const field = document.getElementById(fieldId);
            const errorDiv = document.getElementById(fieldId + 'Error');
            field.classList.add('error');
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
        }

        // 显示全局错误
        function showGlobalError(message) {
            const errorDiv = document.getElementById('globalError');
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
        }

        // 清除所有错误
        function clearErrors() {
            document.querySelectorAll('.input-field').forEach(field => {
                field.classList.remove('error');
            });
            document.querySelectorAll('.error-message').forEach(err => {
                err.classList.remove('show');
            });
        }

        // 输入框焦点效果
        const inputs = document.querySelectorAll('.input-field');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('transform', 'scale-[1.02]');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('transform', 'scale-[1.02]');
            });

            // 输入时清除错误
            input.addEventListener('input', () => {
                input.classList.remove('error');
                const errorDiv = document.getElementById(input.id + 'Error');
                if (errorDiv) errorDiv.classList.remove('show');
                document.getElementById('globalError').classList.remove('show');
            });
        });

        // 添加键盘快捷键支持
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && document.activeElement.tagName !== 'BUTTON') {
                loginForm.dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>
</html>
