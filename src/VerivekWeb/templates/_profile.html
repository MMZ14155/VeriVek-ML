{% extends "base.html" %}

{% block title %}个人主页 - VeriVek{% endblock %}

{% block nav_profile_class %}tab-active{% endblock %}

{% block content %}
<div class="fade-in space-y-6">

    <!-- 个人信息头部 -->
    <div class="glass-panel rounded-2xl p-8 flex items-center space-x-6">
        <div id="profile-avatar" class="w-20 h-20 rounded-2xl flex items-center justify-center text-2xl font-bold text-white bg-gradient-to-br from-indigo-500 to-purple-600 shadow-lg">
            --
        </div>
        <div class="flex-1">
            <div class="flex items-center space-x-3 mb-1">
                <h1 class="text-2xl font-bold" id="profile-username">--</h1>
                <span id="profile-role" class="px-2.5 py-0.5 text-xs rounded-full border">--</span>
            </div>
            <p class="text-gray-400 text-sm" id="profile-joined">加入于 --</p>
        </div>
        <div class="text-right">
            <div class="text-sm text-gray-400">总贡献</div>
            <div class="text-4xl font-bold text-white" id="profile-total">0</div>
        </div>
    </div>

    <!-- 贡献统计卡片 -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
        <div class="metric-card rounded-xl p-5 relative overflow-hidden border-l-4 border-emerald-500">
            <div class="flex items-center justify-between mb-3">
                <span class="text-gray-400 text-sm font-medium">数据集版本</span>
                <span class="w-8 h-8 rounded-lg bg-emerald-500/20 flex items-center justify-center">
                    <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2 1.5 3 3 3h10c1.5 0 3-1 3-3V7c0-2-1.5-3-3-3H7c-1.5 0-3 1-3 3z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 11l3 3 3-3"></path></svg>
                </span>
            </div>
            <div class="text-3xl font-bold text-emerald-400" id="stat-datasets">0</div>
        </div>

        <div class="metric-card rounded-xl p-5 relative overflow-hidden border-l-4 border-purple-500">
            <div class="flex items-center justify-between mb-3">
                <span class="text-gray-400 text-sm font-medium">模型提交</span>
                <span class="w-8 h-8 rounded-lg bg-purple-500/20 flex items-center justify-center">
                    <svg class="w-4 h-4 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                </span>
            </div>
            <div class="text-3xl font-bold text-purple-400" id="stat-models">0</div>
        </div>

        <div class="metric-card rounded-xl p-5 relative overflow-hidden border-l-4 border-orange-500">
            <div class="flex items-center justify-between mb-3">
                <span class="text-gray-400 text-sm font-medium">训练任务</span>
                <span class="w-8 h-8 rounded-lg bg-orange-500/20 flex items-center justify-center">
                    <svg class="w-4 h-4 text-orange-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                </span>
            </div>
            <div class="text-3xl font-bold text-orange-400" id="stat-trainings">0</div>
        </div>
    </div>

    <!-- 贡献分布图表 -->
    <div class="glass-panel rounded-2xl p-6">
        <h2 class="text-lg font-semibold mb-4">贡献类型分布</h2>
        <div class="h-64">
            <canvas id="profile-chart"></canvas>
        </div>
    </div>

    <!-- 管理员：用户管理 -->
    <div id="admin-section" class="glass-panel rounded-2xl overflow-hidden hidden">
        <div class="p-6 border-b border-white/5 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <span class="w-8 h-8 rounded-lg bg-red-500/20 flex items-center justify-center">
                    <svg class="w-4 h-4 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path>
                    </svg>
                </span>
                <h2 class="text-lg font-semibold">用户管理</h2>
            </div>
            <button onclick="openCreateUserModal()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-medium transition-all text-sm flex items-center space-x-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                <span>创建账号</span>
            </button>
        </div>

        <div class="overflow-x-auto">
            <table class="w-full text-left">
                <thead>
                    <tr class="text-xs text-gray-400 border-b border-white/5">
                        <th class="px-6 py-4 font-medium">ID</th>
                        <th class="px-6 py-4 font-medium">用户名</th>
                        <th class="px-6 py-4 font-medium">角色</th>
                        <th class="px-6 py-4 font-medium">加入时间</th>
                        <th class="px-6 py-4 font-medium text-right">操作</th>
                    </tr>
                </thead>
                <tbody id="admin-users-table">
                    <tr>
                        <td colspan="5" class="px-6 py-8 text-center text-gray-500">
                            <svg class="animate-spin w-6 h-6 mx-auto mb-2 text-indigo-500" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                            加载用户列表...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<!-- 创建用户模态框 -->
<div id="create-user-modal" class="fixed inset-0 z-[100] hidden">
    <div class="absolute inset-0 bg-black/70 backdrop-blur-sm transition-opacity" onclick="closeCreateUserModal()"></div>
    <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-full max-w-md p-4">
        <div class="glass-panel rounded-2xl p-8 border border-white/10 shadow-2xl bg-[#13131f]/95">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold">创建新账号</h3>
                <button onclick="closeCreateUserModal()" class="text-gray-400 hover:text-white transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <form id="create-user-form" onsubmit="event.preventDefault(); createUser();">
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1.5">用户名</label>
                        <input type="text" id="new-username" required minlength="3" maxlength="50"
                               class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500"
                               placeholder="请输入用户名">
                    </div>

                    <div>
                        <label class="block text-xs text-gray-400 mb-1.5">密码</label>
                        <input type="password" id="new-password" required minlength="6"
                               class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500"
                               placeholder="至少6位字符">
                    </div>

                    <div>
                        <label class="block text-xs text-gray-400 mb-1.5">角色</label>
                        <select id="new-role" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500">
                            <option value="researcher" selected>研究员</option>
                            <option value="admin">管理员</option>
                            <option value="guest">访客</option>
                        </select>
                    </div>
                </div>

                <div id="create-user-error" class="mt-4 text-sm text-red-400 hidden"></div>

                <div class="mt-6 flex space-x-3">
                    <button type="button" onclick="closeCreateUserModal()"
                            class="flex-1 px-4 py-2.5 bg-white/5 hover:bg-white/10 rounded-xl font-medium transition-all text-sm">取消</button>
                    <button type="submit"
                            class="flex-1 px-4 py-2.5 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-medium transition-all text-sm">创建</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block page_scripts %}
<script src="{{ url_for('static', filename='js/_profile.js') if url_for else 'static/js/_profile.js' }}"></script>
{% endblock %}
