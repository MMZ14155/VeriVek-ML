<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}VeriVek{% endblock %}</title>
    <!-- 外部 CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') if url_for else 'static/css/style.css' }}">
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    {% block extra_head %}{% endblock %}
</head>
<body class="font-sans antialiased overflow-hidden">

    <!-- 顶部导航栏 -->
    <nav class="glass-panel fixed w-full z-50 h-16 flex items-center justify-between px-6 border-b border-white/5">
        <div class="flex items-center space-x-3">
            <div class="w-8 h-8 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-lg flex items-center justify-center font-bold text-white">V</div>
            <span class="text-xl font-semibold tracking-tight">Veri<span id="brand-suffix" class="text-indigo-400">Vek</span></span>
            <span id="version-badge" class="px-2 py-0.5 text-xs bg-indigo-500/20 text-indigo-300 rounded-full border border-indigo-500/30">v0.1</span>
        </div>

        <div class="flex items-center space-x-6">
            <div class="flex items-center space-x-2 text-sm text-gray-400">
                <span class="w-2 h-2 bg-emerald-500 rounded-full status-dot"></span>
                <span>Core 连接正常</span>
            </div>
            <button class="p-2 hover:bg-white/5 rounded-lg transition-colors">
                <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
            </button>
            <div class="w-8 h-8 rounded-full bg-gradient-to-r from-indigo-500 to-purple-500 flex items-center justify-center text-sm font-medium">A</div>
        </div>
    </nav>

    <!-- 侧边栏与主内容区 -->
    <div class="flex pt-16 h-screen">
        <!-- 侧边栏导航 -->
        <aside class="w-64 glass-panel border-r border-white/5 flex flex-col">
            <div class="p-4 space-y-1">
                <a href="{{ url_for('dashboard') if url_for else 'index.html' }}"
                   class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl transition-all duration-200 {% block nav_dashboard_class %}hover:bg-white/5 text-gray-400 hover:text-white{% endblock %} group">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                    <span class="font-medium">仪表板</span>
                </a>

                <a href="{{ url_for('datasets') if url_for else 'datasets.html' }}"
                   class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl transition-all duration-200 {% block nav_datasets_class %}hover:bg-white/5 text-gray-400 hover:text-white{% endblock %} group">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                    <span class="font-medium">数据集</span>
                    <span id="sidebar-dataset-count" class="ml-auto text-xs bg-white/10 px-2 py-0.5 rounded-full">--</span>
                </a>

                <a href="{{ url_for('models') if url_for else 'models.html' }}"
                   class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl transition-all duration-200 {% block nav_models_class %}hover:bg-white/5 text-gray-400 hover:text-white{% endblock %} group">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                    <span class="font-medium">模型</span>
                    <span id="sidebar-model-count" class="ml-auto text-xs bg-white/10 px-2 py-0.5 rounded-full">--</span>
                </a>

                <a href="{{ url_for('training') if url_for else 'training.html' }}"
                   class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl transition-all duration-200 {% block nav_training_class %}hover:bg-white/5 text-gray-400 hover:text-white{% endblock %} group">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    <span class="font-medium">训练控制</span>
                    <span id="training-badge" class="ml-auto w-2 h-2 bg-emerald-500 rounded-full hidden status-dot"></span>
                </a>
            </div>

            <div class="mt-auto p-4 border-t border-white/5 space-y-3">
                <!-- 个人主页 -->
                <a href="{{ url_for('profile') if url_for else 'profile.html' }}"
                   class="w-full flex items-center space-x-3 px-4 py-2.5 rounded-xl transition-all duration-200 hover:bg-white/5 text-gray-400 hover:text-white group">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                    <span class="font-medium">个人主页</span>
                </a>

                <!-- 退出账号按钮 -->
                <a href="{{ url_for('logout') if url_for else 'login.html' }}"
                   class="w-full flex items-center space-x-3 px-4 py-2.5 rounded-xl transition-all duration-200 hover:bg-red-500/10 text-gray-400 hover:text-red-400 group">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                    <span class="font-medium">退出账号</span>
                </a>

                <!-- 侧边栏底部系统状态 -->
                <div class="glass-panel rounded-xl p-4">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-xs text-gray-400">系统状态</span>
                        <span class="text-xs text-emerald-400">正常</span>
                    </div>
                    <div class="space-y-2">
                        <div class="flex justify-between text-xs">
                            <span class="text-gray-500">GPU 显存</span>
                            <span id="gpu-memory-text" class="text-white">-- / -- GB</span>
                        </div>
                        <div class="w-full bg-gray-800 rounded-full h-1.5">
                            <div id="gpu-memory-bar" class="bg-indigo-500 h-1.5 rounded-full" style="width: 0%"></div>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- 主内容区域 -->
        <main class="flex-1 overflow-y-auto bg-gradient-to-br from-verivek-dark to-[#0f0f1a] p-8">
            {% block content %}{% endblock %}
        </main>
    </div>

    <!-- 全局 JavaScript -->
    <script src="{{ url_for('static', filename='js/script.js') if url_for else 'static/js/script.js' }}"></script>
    {% block page_scripts %}{% endblock %}
</body>
</html>
